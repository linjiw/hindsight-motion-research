name: Research website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.mjs'
      - 'results/**'
      - 'artifacts/token_mechanism.png'
      - 'artifacts/carrier_scene_geometry.png'
      - 'artifacts/complete_task.png'
      - 'artifacts/continuation.png'
      - 'artifacts/continuation_admission02.png'
      - 'artifacts/selection_codec.png'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.mjs'
      - 'results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_site.py
      - run: node --check site/app.js
      - run: node scripts/check_site.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
